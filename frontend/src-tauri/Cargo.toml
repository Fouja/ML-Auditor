[package]
name = "ml-auditor-desktop"
version = "0.1.0"
description = "ML-Auditor desktop app — full-stack AI command center"
authors = ["Fouja"]
license = "MIT"
repository = "https://github.com/Fouja/ML-Auditor"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
