apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlauditor-postgresql
  namespace: mlauditor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlauditor-postgresql
  template:
    metadata:
      labels:
        app: mlauditor-postgresql
    spec:
      containers:
        - name: postgresql
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "mlauditor_db"
            - name: POSTGRES_USER
              value: "mlauditor"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlauditor-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: mlauditor-postgres-pvc
        - name: init-sql
          configMap:
            name: mlauditor-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: mlauditor
spec:
  selector:
    app: mlauditor-postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlauditor-postgres-pvc
  namespace: mlauditor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlauditor-init-sql
  namespace: mlauditor
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
