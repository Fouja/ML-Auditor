apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlauditor-backend
  namespace: mlauditor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlauditor-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mlauditor-backend
    spec:
      containers:
        - name: backend
          image: mlauditor/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlauditor-secrets
            - configMapRef:
                name: mlauditor-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mlauditor-backend
  namespace: mlauditor
spec:
  selector:
    app: mlauditor-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlauditor-config
  namespace: mlauditor
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "mlauditor.com,www.mlauditor.com"
  DJANGO_DATABASE_URL: "postgres://mlauditor:$(POSTGRES_PASSWORD)@postgresql:5432/mlauditor_db"
  DJANGO_CACHE_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
  DJANGO_CELERY_BROKER_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
  DJANGO_CELERY_RESULT_BACKEND: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
  DJANGO_CHANNELS_LAYERS: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
  NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NIM_MODEL: "meta/llama-3.3-70b-instruct"
  ML_SERVICE_URL: "http://ml-service:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlauditor-secrets
  namespace: mlauditor
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  NIM_API_KEY: "${NIM_API_KEY}"
  PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
  PLAID_SECRET: "${PLAID_SECRET}"
  GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
  GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
  CANVA_CLIENT_ID: "${CANVA_CLIENT_ID}"
  CANVA_CLIENT_SECRET: "${CANVA_CLIENT_SECRET}"
  SENTRY_DSN: "${SENTRY_DSN}"
