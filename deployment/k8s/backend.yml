apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlauditor-backend
  namespace: mlauditor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlauditor-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mlauditor-backend
    spec:
      containers:
        - name: backend
          image: mlauditor/backend:latest
          command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mlauditor-secrets
            - configMapRef:
                name: mlauditor-config
          env:
            - name: DJANGO_DATABASE_URL
              value: "postgres://mlauditor:$(POSTGRES_PASSWORD)@postgresql:5432/mlauditor_db"
            - name: DJANGO_CACHE_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: DJANGO_CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: DJANGO_CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
            - name: DJANGO_CHANNELS_LAYERS
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mlauditor-backend
  namespace: mlauditor
spec:
  selector:
    app: mlauditor-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlauditor-config
  namespace: mlauditor
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "mlauditor.com,www.mlauditor.com"
  NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NIM_MODEL: "meta/llama-3.3-70b-instruct"
  WEB_TOOLS_URL: "http://web-tools:8090"
  # ELK stack — logs & pod/container metrics land in Elasticsearch → Kibana.
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  KIBANA_URL: "http://kibana:5601"
  LOGSTASH_HOST: "logstash"
  LOGSTASH_TCP_PORT: "5000"
  # JobChameleon microservice
  JC_URL: "http://jobchameleon:8787"
  JC_MCP_URL: "http://jobchameleon:8788/mcp"
  JCAPP_PUBLIC_URL: "https://mlauditor.com"
  JCAPP_MCP_URL: "http://jobcamelonapp:8790/mcp"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlauditor-secrets
  namespace: mlauditor
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  NIM_API_KEY: "${NIM_API_KEY}"
  JC_API_TOKEN: "${JC_API_TOKEN}"
  PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
  PLAID_SECRET: "${PLAID_SECRET}"
  GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
  GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
  CANVA_CLIENT_ID: "${CANVA_CLIENT_ID}"
  CANVA_CLIENT_SECRET: "${CANVA_CLIENT_SECRET}"
  SENTRY_DSN: "${SENTRY_DSN}"
