apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlauditor-ingress
  namespace: mlauditor
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "10"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mlauditor.com
        - www.mlauditor.com
        - kibana.mlauditor.com
      secretName: mlauditor-tls
  rules:
    - host: mlauditor.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: mlauditor-backend
                port:
                  number: 8000
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: mlauditor-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlauditor-frontend
                port:
                  number: 3000
    - host: kibana.mlauditor.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
