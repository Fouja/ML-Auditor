apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlauditor-redis
  namespace: mlauditor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlauditor-redis
  template:
    metadata:
      labels:
        app: mlauditor-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlauditor-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mlauditor
spec:
  selector:
    app: mlauditor-redis
  ports:
    - port: 6379
      targetPort: 6379
