global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "django-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "celery-worker"
    static_configs:
      - targets: ["celery_worker:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "ml-service"
    static_configs:
      - targets: ["ml_service:8001"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 15s

  - job_name: "postgresql"
    static_configs:
      - targets: ["db:5432"]
    scrape_interval: 15s

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
    metrics_path: "/stub_status"
    scrape_interval: 10s
