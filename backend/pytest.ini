[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --strict-markers
    --tb=short
    -q
    --cov=apps
    --cov-report=term-missing
    --cov-report=html:htmlcov

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */admin.py
    manage.py
    config/wsgi.py
    config/asgi.py

[coverage:report]
show_missing = True
fail_under = 60
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.
