[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = '''
/(
    venv
  | \.venv
  | node_modules
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E501"]
exclude = ["migrations", "__pycache__", ".git", "venv", ".venv"]

[tool.flake8.per-file-ignores]
"config/api.py" = ["E402"]
"config/asgi.py" = ["E402"]
"apps/integrations/api.py" = ["E402"]
