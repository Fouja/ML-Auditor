name: ML-Auditor CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mlauditor_test
          POSTGRES_USER: mlauditor
          POSTGRES_PASSWORD: mlauditor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Run Black (check)
        run: black --check backend/
      
      - name: Run isort (check)
        run: isort --check-only backend/
      
      - name: Run Flake8
        run: flake8 backend/
      
      - name: Run MyPy
        run: mypy backend/
        continue-on-error: true
      
      - name: Run Tests with Coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DATABASE_URL: postgres://mlauditor:mlauditor@localhost:5432/mlauditor_test
          DJANGO_CACHE_URL: redis://localhost:6379/0
          DJANGO_CELERY_BROKER_URL: redis://localhost:6379/1
          DJANGO_CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET_KEY: jwt-test-secret
        run: |
          cd backend
          pytest --cov=apps --cov-report=xml --cov-report=html -v
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Run ESLint
        run: yarn lint
      
      - name: Run Tests
        run: yarn test
      
      - name: Build
        run: yarn build

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend
        run: |
          docker build -f docker/Dockerfile.backend -t mlauditor-backend:latest ./backend
      
      - name: Build Frontend
        run: |
          docker build -f docker/Dockerfile.frontend -t mlauditor-frontend:latest ./frontend
