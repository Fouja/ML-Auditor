name: Release desktop app

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend sidecar
        working-directory: ./backend
        run: |
          source ../.venv/bin/activate
          DJANGO_SETTINGS_MODULE=config.desktop_settings pyinstaller pyinstaller_desktop.spec --clean --noconfirm
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/ml-auditor-backend ../frontend/src-tauri/binaries/ml-auditor-backend-x86_64-unknown-linux-gnu

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Download notification sound
        run: |
          mkdir -p frontend/src-tauri/assets
          mkdir -p frontend/public
          curl -L -o frontend/src-tauri/assets/notification.mp3 "https://archive.org/download/classical-music-mix-by-various-artists/18%20-%20Beethoven%20-%20Fur%20Elise.mp3"
          cp frontend/src-tauri/assets/notification.mp3 frontend/public/notification.mp3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app (Linux .deb)
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_BUILD: '1'
        run: npm run tauri:build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlauditor-linux
          path: |
            frontend/src-tauri/target/release/bundle/deb/ML-Auditor_*_amd64.deb*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Build backend sidecar (.exe)
        working-directory: ./backend
        shell: pwsh
        run: |
          $env:DJANGO_SETTINGS_MODULE = 'config.desktop_settings'
          .venv\Scripts\python -m PyInstaller pyinstaller_desktop.spec --clean --noconfirm
          New-Item -ItemType Directory -Force -Path ..\frontend\src-tauri\binaries | Out-Null
          Copy-Item dist\ml-auditor-backend.exe ..\frontend\src-tauri\binaries\ml-auditor-backend-x86_64-pc-windows-msvc.exe
          Get-Item ..\frontend\src-tauri\binaries\ml-auditor-backend-x86_64-pc-windows-msvc.exe | Select-Object Name, Length

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Download notification sound
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\assets | Out-Null
          New-Item -ItemType Directory -Force -Path frontend\public | Out-Null
          curl.exe -L -o frontend\src-tauri\assets\notification.mp3 "https://archive.org/download/classical-music-mix-by-various-artists/18%20-%20Beethoven%20-%20Fur%20Elise.mp3"
          Copy-Item frontend\src-tauri\assets\notification.mp3 frontend\public\notification.mp3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app (Windows NSIS)
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_BUILD: '1'
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlauditor-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/ML-Auditor_*_x64-setup.exe*
          if-no-files-found: error

  release:
    needs: [build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded artifacts
        run: find artifacts -type f

      - name: Assemble latest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          TAG="${GITHUB_REF_NAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          DEB=$(find artifacts -name 'ML-Auditor_*_amd64.deb' | head -n1)
          DEB_SIG=$(find artifacts -name 'ML-Auditor_*_amd64.deb.sig' | head -n1)
          EXE=$(find artifacts -name 'ML-Auditor_*_x64-setup.exe' | head -n1)
          EXE_SIG=$(find artifacts -name 'ML-Auditor_*_x64-setup.exe.sig' | head -n1)

          DEB_NAME=$(basename "$DEB")
          EXE_NAME=$(basename "$EXE")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/$REPO/releases/tag/$TAG" \
            --arg pub_date "$PUB_DATE" \
            --arg sig_deb "$(cat "$DEB_SIG")" \
            --arg url_deb "https://github.com/$REPO/releases/download/$TAG/$DEB_NAME" \
            --arg sig_exe "$(cat "$EXE_SIG")" \
            --arg url_exe "https://github.com/$REPO/releases/download/$TAG/$EXE_NAME" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {signature: $sig_deb, url: $url_deb}, "windows-x86_64": {signature: $sig_exe, url: $url_exe}}}' \
            > latest.json
          cat latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            latest.json
            artifacts/**/*.deb
            artifacts/**/*.deb.sig
            artifacts/**/*.exe
            artifacts/**/*.exe.sig