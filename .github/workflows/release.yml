name: Release desktop app

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv ../.venv
          source ../.venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend sidecar
        working-directory: ./backend
        run: |
          source ../.venv/bin/activate
          DJANGO_SETTINGS_MODULE=config.desktop_settings pyinstaller pyinstaller_desktop.spec --clean --noconfirm
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/ml-auditor-backend ../frontend/src-tauri/binaries/ml-auditor-backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_BUILD: '1'
        run: npm run tauri:build

      - name: Generate latest.json
        working-directory: ./frontend/src-tauri/target/release/bundle/deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DEB_NAME="ML-Auditor_${VERSION}_amd64.deb"
          SIG_NAME="${DEB_NAME}.sig"
          SIG=$(cat "${SIG_NAME}" 2>/dev/null || echo "")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${DEB_NAME}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            frontend/src-tauri/target/release/bundle/deb/ML-Auditor_*_amd64.deb
            frontend/src-tauri/target/release/bundle/deb/ML-Auditor_*_amd64.deb.sig
            frontend/src-tauri/target/release/bundle/deb/latest.json
