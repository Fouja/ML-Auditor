# Docker Compose for ML-Auditor Development

version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg16
    container_name: mlauditor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlauditor_db
      POSTGRES_USER: mlauditor
      POSTGRES_PASSWORD: mlauditor
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlauditor -d mlauditor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching, Celery, and Channels
  redis:
    image: redis:7-alpine
    container_name: mlauditor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mlauditor_backend
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_DATABASE_URL=postgres://mlauditor:mlauditor@db:5432/mlauditor_db
      - DJANGO_CACHE_URL=redis://redis:6379/0
      - DJANGO_CELERY_BROKER_URL=redis://redis:6379/1
      - DJANGO_CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_CHANNELS_LAYERS=redis://redis:6379/3
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - LOG_DIR=/var/log/ml-auditor/backend
      - CLIENT_LOG_DIR=/var/log/ml-auditor/clients
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.1-8b-instruct}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integrations/oauth/google/callback}
      - ELASTIC_APM_SERVICE_NAME=ml-auditor-backend
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_ENABLED=${ELASTIC_APM_ENABLED:-false}
      - WEB_TOOLS_URL=http://web-tools:8090
      - JC_URL=http://jobchameleon:8787
      - JC_MCP_URL=http://jobchameleon:8788/mcp
      - JC_API_TOKEN=${JC_API_TOKEN:-}
      - JC_PUBLIC_URL=${JC_PUBLIC_URL:-http://localhost:8787}
      - JCAPP_PUBLIC_URL=${JCAPP_PUBLIC_URL:-http://localhost:8088}
      - JCAPP_WEB_HOST_PORT=${JCAPP_WEB_HOST_PORT:-8088}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.1-8b-instruct}
      - CLIENT_LOG_DIR=/var/log/ml-auditor/clients
      - LOGSTASH_TCP_HOST=logstash
      - LOGSTASH_TCP_PORT=5000
    ports:
      - "8000:8000"
    group_add:
      # Host docker group GID — grants the uid-1000 app user access to the
      # mounted docker.sock so the container-control button works.
      - ${DOCKER_GROUP_ID:-116}
    volumes:
      - ./backend:/app
      - ./logs:/var/log/ml-auditor
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Allow the "Run JobCamelonapp container" button to talk to the host
      # Docker daemon and build from the JobCamelonapp source tree.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./JobCamelonapp:/repo/JobCamelonapp:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mlauditor_celery_worker
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_DATABASE_URL=postgres://mlauditor:mlauditor@db:5432/mlauditor_db
      - DJANGO_CACHE_URL=redis://redis:6379/0
      - DJANGO_CELERY_BROKER_URL=redis://redis:6379/1
      - DJANGO_CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_DIR=/var/log/ml-auditor/backend
      - CLIENT_LOG_DIR=/var/log/ml-auditor/clients
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integrations/oauth/google/callback}
      - ELASTIC_APM_SERVICE_NAME=ml-auditor-backend
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_ENABLED=${ELASTIC_APM_ENABLED:-false}
    volumes:
      - ./backend:/app
      - ./logs:/var/log/ml-auditor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info -c 4
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,os; ex=0 if any('celery' in open(f'/proc/{p}/cmdline','rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit() and os.access(f'/proc/{p}/cmdline',os.R_OK)) else 1; sys.exit(ex)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mlauditor_celery_beat
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_DATABASE_URL=postgres://mlauditor:mlauditor@db:5432/mlauditor_db
      - DJANGO_CACHE_URL=redis://redis:6379/0
      - DJANGO_CELERY_BROKER_URL=redis://redis:6379/1
      - DJANGO_CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_DIR=/var/log/ml-auditor/backend
      - CLIENT_LOG_DIR=/var/log/ml-auditor/clients
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integrations/oauth/google/callback}
      - ELASTIC_APM_SERVICE_NAME=ml-auditor-celery-beat
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_ENABLED=${ELASTIC_APM_ENABLED:-false}
    volumes:
      - ./backend:/app
      - ./logs:/var/log/ml-auditor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,os; ex=0 if any('celery' in open(f'/proc/{p}/cmdline','rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit() and os.access(f'/proc/{p}/cmdline',os.R_OK)) else 1; sys.exit(ex)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mlauditor_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: >
      sh -c "npm run dev -- --webpack"

  # Web Tools Microservice (Agent-Reach: web read/search/RSS)
  web-tools:
    build:
      context: ./web-tools
      dockerfile: Dockerfile
    container_name: mlauditor_web_tools
    restart: unless-stopped
    environment:
      - EXA_API_KEY=${EXA_API_KEY:-}
    ports:
      - "8090:8090"

  # MCP Server — exposes ML-Auditor tools (tasks, notes, calendar, web search,
  # news, Agent-Reach status) over the Model Context Protocol (StreamableHTTP).
  mcp-server:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mlauditor_mcp_server
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_DATABASE_URL=postgres://mlauditor:mlauditor@db:5432/mlauditor_db
      - DJANGO_CACHE_URL=redis://redis:6379/0
      - DJANGO_CELERY_BROKER_URL=redis://redis:6379/1
      - DJANGO_CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_CHANNELS_LAYERS=redis://redis:6379/3
      - WEB_TOOLS_URL=http://web-tools:8090
      - ML_AUDITOR_MCP_USER_EMAIL=${ML_AUDITOR_MCP_USER_EMAIL:-test@test.com}
      - JC_URL=http://jobchameleon:8787
      - JC_MCP_URL=http://jobchameleon:8788/mcp
      - JC_API_TOKEN=${JC_API_TOKEN:-}
      - JC_PUBLIC_URL=${JC_PUBLIC_URL:-http://localhost:8787}
      - LOG_DIR=/var/log/ml-auditor/backend
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integrations/oauth/google/callback}
      - ELASTIC_APM_SERVICE_NAME=ml-auditor-mcp-server
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_ENABLED=${ELASTIC_APM_ENABLED:-false}
    ports:
      - "8100:8100"
    volumes:
      - ./backend:/app
      - ./logs:/var/log/ml-auditor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-tools:
        condition: service_started
    command: python -m apps.agents.mcp_server --http --host 0.0.0.0 --port 8100
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST http://localhost:8100/mcp -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"health\",\"version\":\"0\"}}}' | grep -q jsonrpc"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # JobChameleon — local-first AI job intelligence workbench (FastAPI gateway +
  # MCP over HTTP). Uses the same NVIDIA NIM key/model as ML-Auditor.
  jobchameleon:
    build:
      context: ./jobchameleon
      dockerfile: ../docker/Dockerfile.jobchameleon
    container_name: mlauditor_jobchameleon
    restart: unless-stopped
    environment:
      - JC_API_TOKEN=${JC_API_TOKEN:-}
      - JC_HOST=0.0.0.0
      - JC_ALLOWED_HOSTS=jobchameleon,localhost,127.0.0.1
      - JCAPP_MCP_URL=http://jobcamelonapp:8790/mcp
      - NVIDIA_API_KEY=${NIM_API_KEY:-}
      - NVIDIA_MODEL=${NIM_MODEL:-meta/llama-3.1-8b-instruct}
      - XDG_DATA_HOME=/app/data
    ports:
      - "8787:8787"
      - "8788:8788"

  # JobCamelonapp — the full JobChameleon workbench (desktop repo) run as a
  # container. Started on demand from the JobChameleon integration card
  # ("Run JobCamelonapp container") which creates a fresh container on the
  # compose network; this definition keeps it buildable/reproducible and wires
  # the MCP link back to the jobchameleon microservice.
  jobcamelonapp:
    build:
      context: ./JobCamelonapp
      dockerfile: Dockerfile
    image: mlauditor/jobcamelonapp:latest
    profiles: ["jobcamelonapp"]
    container_name: mlauditor_jobcamelonapp
    restart: unless-stopped
    environment:
      - JC_TOKEN=${JC_API_TOKEN:-}
      - JC_HOST=0.0.0.0
      - JC_ALLOWED_HOSTS=jobcamelonapp,localhost,127.0.0.1
      - JC_MCP_URL=http://jobchameleon:8788/mcp
      - JC_MCP_PORT=8790
      - JC_WEB_PORT=1403
      - NVIDIA_API_KEY=${NIM_API_KEY:-}
      - NVIDIA_MODEL=${NIM_MODEL:-meta/llama-3.1-8b-instruct}
      - XDG_DATA_HOME=/app/data
    ports:
      - "8089:8088"
      - "1403:1403"
      - "8790:8790"

  # ===========================================
  # ELK Stack — Logging & Monitoring
  # ===========================================

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: mlauditor_elasticsearch
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # apm-data ES plugin: installs APM index/component templates + ingest
      # pipelines so APM Server can run without Fleet or stack security.
      - xpack.apm_data.enabled=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - ELASTIC_PASSWORD=changeme
      - cluster.name=ml-auditor-logs
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: mlauditor_logstash
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "5044:5044"
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/var/log/ml-auditor:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: mlauditor_kibana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # APM Server — receives traces from instrumented services
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.13.4
    container_name: mlauditor_apm_server
    profiles: ["monitoring"]
    restart: unless-stopped
    command: >
      apm-server -e -strict.perms=false
      -E apm-server.host=0.0.0.0:8200
      -E apm-server.data_streams.wait_for_integration=false
      -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
    ports:
      - "8200:8200"
    environment:
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - xpack.security.enabled=false
      - apm-server.host=0.0.0.0:8200
      - apm-server.data_streams.wait_for_integration=false
      - logging.to_files=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8200' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Filebeat — collects logs from all services
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: mlauditor_filebeat
    profiles: ["monitoring"]
    restart: unless-stopped
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/ml-auditor:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started

  # Metricbeat — collects system & container metrics
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.13.4
    container_name: mlauditor_metricbeat
    profiles: ["monitoring"]
    restart: unless-stopped
    user: root
    command: metricbeat -e -strict.perms=false
    volumes:
      - ./docker/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - metricbeat_data:/usr/share/metricbeat/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
    environment:
      - HOST_ROOT=/hostfs
      - DOCKER_API_VERSION=1.44
    depends_on:
      elasticsearch:
        condition: service_healthy

  # One-off Metricbeat setup: loads built-in Kibana dashboards and ML jobs.
  # Run manually after Kibana is healthy: docker compose --profile monitoring up metricbeat-setup
  metricbeat-setup:
    image: docker.elastic.co/beats/metricbeat:8.13.4
    container_name: mlauditor_metricbeat_setup
    profiles: ["monitoring"]
    restart: "no"
    user: root
    command: >
      sh -c "metricbeat setup -e -strict.perms=false -E output.elasticsearch.hosts=[\"http://elasticsearch:9200\"]"
    volumes:
      - ./docker/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - setup.kibana.host=http://kibana:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  elasticsearch_data:
  logstash_data:
  filebeat_data:
  metricbeat_data:
