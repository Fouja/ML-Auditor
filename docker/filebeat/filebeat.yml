filebeat.inputs:
  # Backend Django logs
  - type: log
    enabled: true
    paths:
      - /var/log/ml-auditor/backend/*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      type: backend
    fields_under_root: true

  # ML Service logs
  - type: log
    enabled: true
    paths:
      - /var/log/ml-auditor/ml-service/*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      type: ml-service
    fields_under_root: true

  # Frontend logs
  - type: log
    enabled: true
    paths:
      - /var/log/ml-auditor/frontend/*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      type: frontend
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]
  bulk_max_size: 2048

logging.level: info
logging.to_files: true
logging.files:
  path: /usr/share/filebeat/logs
  name: filebeat
  keepfiles: 7
  permissions: 0644
