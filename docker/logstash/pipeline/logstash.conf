input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [@metadata][beat] {
    if [log][file][path] {
      mutate { add_field => { "path" => "%{[log][file][path]}" } }
    }
    # Filebeat is configured to place parsed JSON under the "parsed" key so
    # it does not collide with Beats metadata fields. Promote those fields to
    # the top level for downstream routing, overwriting only non-Beats fields.
    if [parsed] {
      ruby {
        code => '
          parsed = event.get("parsed")
          if parsed.is_a?(Hash)
            protected = ["@timestamp", "@metadata", "@version", "host", "agent", "ecs", "input", "log", "tags", "path"]
            parsed.each do |key, value|
              event.set(key, value) unless protected.include?(key)
            end
          end
        '
      }
      mutate { remove_field => ["parsed"] }
    }
  }
  # Filebeat injects an ECS "event" object that collides with our own
  # string event names. Drop it so each service controls its own fields.
  mutate { remove_field => ["event"] }
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
  if [service] == "backend" {
    mutate { add_field => { "index_prefix" => "ml-auditor-backend" } }
  } else if [service] == "web" or [service] == "frontend" {
    mutate { add_field => { "index_prefix" => "ml-auditor-web" } }
  } else if [service] == "desktop" {
    mutate { add_field => { "index_prefix" => "ml-auditor-desktop" } }
  } else if [service] == "mobile" {
    mutate { add_field => { "index_prefix" => "ml-auditor-mobile" } }
  } else if [service] == "integration" {
    mutate { add_field => { "index_prefix" => "ml-auditor-integration" } }
  } else if [service] == "llm" {
    mutate { add_field => { "index_prefix" => "ml-auditor-llm" } }
  } else {
    mutate { add_field => { "index_prefix" => "ml-auditor-tcp-ingest" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{index_prefix}-%{+YYYY.MM.dd}"
  }
}
