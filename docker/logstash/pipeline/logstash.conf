input {
  file {
    path => "/var/log/ml-auditor/backend/*.log"
    type => "backend"
    codec => json
    sincedb_path => "/usr/share/logstash/data/sincedb_backend"
  }

  file {
    path => "/var/log/ml-auditor/ml-service/*.log"
    type => "ml-service"
    codec => json
    sincedb_path => "/usr/share/logstash/data/sincedb_ml"
  }

  file {
    path => "/var/log/ml-auditor/frontend/*.log"
    type => "frontend"
    codec => json
    sincedb_path => "/usr/share/logstash/data/sincedb_frontend"
  }
}

filter {
  if [type] == "backend" {
    mutate {
      add_field => { "service" => "backend" }
      add_field => { "stack" => "django" }
    }

    if [asctime] {
      date {
        match => [ "asctime", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss" ]
        target => "@timestamp"
      }
    }

    if [request_method] {
      mutate {
        add_field => { "event_type" => "http_request" }
      }
    }

    if [levelname] == "ERROR" or [levelname] == "CRITICAL" {
      mutate {
        add_field => { "event_type" => "error" }
        add_tag => [ "error" ]
      }
    } else if [levelname] == "WARNING" {
      mutate {
        add_field => { "event_type" => "warning" }
        add_tag => [ "warning" ]
      }
    } else {
      mutate {
        add_field => { "event_type" => "info" }
      }
    }

    if [message] =~ /login|authenticate|token/ {
      mutate { add_tag => [ "auth" ] }
    }
    if [message] =~ /create|update|delete|save/ {
      mutate { add_tag => [ "crud" ] }
    }
  }

  if [type] == "ml-service" {
    mutate {
      add_field => { "service" => "ml-service" }
      add_field => { "stack" => "fastapi" }
    }

    if [level] == "error" {
      mutate {
        add_field => { "event_type" => "error" }
        add_tag => [ "error" ]
      }
    } else if [level] == "warning" {
      mutate {
        add_field => { "event_type" => "warning" }
        add_tag => [ "warning" ]
      }
    } else {
      mutate {
        add_field => { "event_type" => "info" }
      }
    }

    if [message] =~ /agent|crewai|nim/ {
      mutate { add_tag => [ "ai" ] }
    }
  }

  if [type] == "frontend" {
    mutate {
      add_field => { "service" => "frontend" }
      add_field => { "stack" => "nextjs" }
    }

    if [level] == "error" {
      mutate {
        add_field => { "event_type" => "error" }
        add_tag => [ "error" ]
      }
    } else if [level] == "warn" {
      mutate {
        add_field => { "event_type" => "warning" }
        add_tag => [ "warning" ]
      }
    } else {
      mutate {
        add_field => { "event_type" => "info" }
      }
    }
  }

  mutate {
    remove_field => [ "@version" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-auditor-%{type}-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
}
